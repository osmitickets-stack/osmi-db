name: Docker Build & Publish

on:
  push:
    branches:
      - main
    paths:
      - 'migrations/**'
      - 'seeds/**'
      - 'scripts/seed.sh'
      - 'Dockerfile.migrate'
      - 'Dockerfile.seed'
      - '.github/workflows/docker.yml'

  workflow_dispatch:
    inputs:
      image:
        description: Image to publish
        type: choice
        options:
          - migrate
          - seed
          - both
        default: migrate
      promote_latest:
        description: Explicitly update latest (main only)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  plan:
    name: Select changed images
    runs-on: ubuntu-latest
    outputs:
      migrate: ${{ steps.select.outputs.migrate }}
      seed: ${{ steps.select.outputs.seed }}
    steps:
      - name: Checkout repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select images
        id: select
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          IMAGE: ${{ inputs.image }}
          PROMOTE_LATEST: ${{ inputs.promote_latest }}
        run: |
          set -euo pipefail
          migrate=false
          seed=false
          if [[ "$EVENT" == workflow_dispatch ]]; then
            if [[ "$PROMOTE_LATEST" == true && "$REF" != refs/heads/main ]]; then
              echo 'latest promotion is allowed only from main' >&2
              exit 1
            fi
            case "$IMAGE" in
              migrate) migrate=true ;;
              seed) seed=true ;;
              both) migrate=true; seed=true ;;
              *) echo 'Invalid image selection' >&2; exit 1 ;;
            esac
          else
            [[ "$EVENT" == push && "$REF" == refs/heads/main ]]
            git cat-file -e "${BEFORE}^{commit}"
            git cat-file -e "${AFTER}^{commit}"
            changed="$(git diff --name-only "$BEFORE" "$AFTER")"
            while IFS= read -r path; do
              case "$path" in
                migrations/*|Dockerfile.migrate|.github/workflows/docker.yml) migrate=true ;;
                seeds/*|scripts/seed.sh|Dockerfile.seed) seed=true ;;
              esac
            done <<< "$changed"
          fi
          echo "migrate=$migrate" >> "$GITHUB_OUTPUT"
          echo "seed=$seed" >> "$GITHUB_OUTPUT"


  migrate:
    needs: plan
    if: needs.plan.outputs.migrate == 'true'
    permissions:
      contents: read
      packages: write

    name: Build & Publish Migrate Image

    runs-on: ubuntu-latest

    timeout-minutes: 30

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: migrate_meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/osmitickets-stack/osmi-db-migrate
          flavor: latest=false
          tags: |
            type=raw,value=sha-${{ github.sha }}-run-${{ github.run_id }}-${{ github.run_attempt }}
            type=raw,value=latest,enable=${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.promote_latest }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Build & Push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.migrate
          push: true
          platforms: linux/amd64
          tags: ${{ steps.migrate_meta.outputs.tags }}
          labels: ${{ steps.migrate_meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Record image digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          test -n "$DIGEST"
          echo "Migrate image: ghcr.io/osmitickets-stack/osmi-db-migrate@$DIGEST" >> "$GITHUB_STEP_SUMMARY"

  seed:
    needs: plan
    permissions:
      contents: read
      packages: write

    name: Build & Publish Seed Image

    if: needs.plan.outputs.seed == 'true'

    runs-on: ubuntu-latest

    timeout-minutes: 30

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: seed_meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/osmitickets-stack/osmi-db-seed
          flavor: latest=false
          tags: |
            type=raw,value=sha-${{ github.sha }}-run-${{ github.run_id }}-${{ github.run_attempt }}
            type=raw,value=latest,enable=${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.promote_latest }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Build & Push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.seed
          push: true
          platforms: linux/amd64
          tags: ${{ steps.seed_meta.outputs.tags }}
          labels: ${{ steps.seed_meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Record image digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          test -n "$DIGEST"
          echo "Seed image: ghcr.io/osmitickets-stack/osmi-db-seed@$DIGEST" >> "$GITHUB_STEP_SUMMARY"
