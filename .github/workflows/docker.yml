name: Docker Build & Publish

on:
  push:
    branches:
      - main
    paths:
      - 'migrations/**'
      - 'seeds/**'
      - 'scripts/**'
      - 'Dockerfile.migrate'
      - 'Dockerfile.seed'
      - '.github/workflows/docker.yml'

  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:

  migrate:

    name: Build & Publish Migrate Image

    runs-on: ubuntu-latest

    timeout-minutes: 30

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: migrate_meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/osmitickets-stack/osmi-db-migrate
          tags: |
            type=raw,value=latest
            type=ref,event=branch
            type=sha

      - name: Build & Push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.migrate
          push: true
          platforms: linux/amd64
          tags: ${{ steps.migrate_meta.outputs.tags }}
          labels: ${{ steps.migrate_meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

  seed:

    name: Build & Publish Seed Image

    runs-on: ubuntu-latest

    timeout-minutes: 30

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: seed_meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/osmitickets-stack/osmi-db-seed
          tags: |
            type=raw,value=latest
            type=ref,event=branch
            type=sha

      - name: Build & Push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.seed
          push: true
          platforms: linux/amd64
          tags: ${{ steps.seed_meta.outputs.tags }}
          labels: ${{ steps.seed_meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false