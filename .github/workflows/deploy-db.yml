name: Database production release gate

# A merge may publish an immutable migrate image, but must never apply
# migrations, run seeds, or recreate database dependencies automatically.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  instructions:
    runs-on: ubuntu-latest
    steps:
      - name: Require the reviewed one-migration procedure
        run: |
          echo "Production migration is intentionally manual."
          echo "Use the verified image digest, backup and isolated restore, version precheck, and up 1."
          echo "Do not run seeds or start PostgreSQL or Redis as part of a migration."
